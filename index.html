<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PharmaFlow</title><style>
:root{--n:#123b4a;--t:#20a28a;--bg:#f5f8f9;--line:#e2eaec;--muted:#71818a;--red:#d95c5c;--amber:#e9a43a}*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;color:#24323a;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:235px;background:#0d2d39;color:#c3d6da;padding:22px 14px}.brand{font-size:20px;font-weight:800;color:#fff;padding:4px 10px 28px}.brand i{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--t);font-style:normal;margin-right:10px}.nav button{width:100%;display:block;text-align:left;background:transparent;border:0;color:#a9c0c6;padding:12px 14px;border-radius:8px;font-weight:600}.nav button.active,.nav button:hover{background:#ffffff12;color:white}.user{position:absolute;bottom:22px;color:#fff;padding:14px;border-top:1px solid #ffffff18;width:205px}.main{flex:1}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);padding:0 32px;display:flex;align-items:center;justify-content:space-between}.top strong{font-size:19px}.role,.tag{padding:6px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#e9f7f3;color:#187d68}.content{padding:30px;max-width:1450px}.head{display:flex;justify-content:space-between;align-items:start;margin-bottom:22px}.head h1{margin:0 0 6px;font-size:26px}.head p{margin:0;color:var(--muted)}.primary,.secondary{padding:10px 15px;border-radius:8px;font-weight:700}.primary{background:var(--t);color:#fff;border:0}.secondary{background:#fff;border:1px solid var(--line);color:#24323a}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px;box-shadow:0 10px 25px #143e4a0a}.metric{display:flex;justify-content:space-between}.metric h2{margin:10px 0 5px;font-size:27px}.muted,.metric-label{color:var(--muted)}.delta{font-size:12px;color:#21876e}.icon{background:#e9f7f3;color:var(--t);padding:10px;border-radius:8px;height:34px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.panel h3{margin:0 0 16px}.bars{height:210px;display:flex;align-items:end;gap:12px}.bar{flex:1;background:#b9e8dc;border-radius:5px 5px 0 0;min-height:10px}.bar.on{background:var(--t)}.bars div{height:100%;display:flex;flex-direction:column;justify-content:end;text-align:center;color:var(--muted);font-size:11px}.alert{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.alert:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--red);margin-top:4px}.dot.a{background:var(--amber)}.alert p{margin:4px 0 0;color:var(--muted);font-size:12px}.table-panel{margin-top:20px}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{flex:1}.toolbar input,.toolbar select,.form input,.form select{padding:10px;border:1px solid var(--line);border-radius:8px;background:white}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;background:#f8fafb}.tag{display:inline-block}.tag.warn{background:#fff4df;color:#9b6613}.tag.danger{background:#ffeded;color:#b64646}.sale{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.tile{padding:13px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px}.tile:hover{border-color:var(--t)}.tile b,.tile small{display:block}.tile small{color:var(--muted);margin-top:7px}.cart{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.empty{text-align:center;padding:35px;color:var(--muted)}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin:20px 0}.tabs{display:flex;gap:10px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{background:#fff;border:1px solid var(--line);padding:10px 14px;color:#24323a;font-weight:700;border-radius:8px 8px 0 0}.tabs button:hover{background:#e9f7f3;color:var(--t)}.tabs .active{color:#fff;background:var(--t);border-color:var(--t)}.modal-bg{position:fixed;inset:0;background:#0d2d3966;display:grid;place-items:center}.modal{background:#fff;border-radius:13px;padding:22px;width:min(560px,calc(100% - 30px))}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;font-weight:700;color:var(--muted)}.form .full{grid-column:1/-1}.form input,.form select{width:100%;margin-top:5px}.modal-head{display:flex;justify-content:space-between}.close{background:transparent;border:0;font-size:24px;color:var(--muted)}.actions{text-align:right;margin-top:20px}@media(max-width:900px){.side{width:65px}.brand span,.nav span,.user{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid,.sale{grid-template-columns:1fr}}@media(max-width:600px){.content{padding:18px}.top{padding:0 18px}.tiles{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><i>✚</i><span>PharmaFlow</span></div><nav class="nav"><button class="active" data-p="dashboard">◈ <span>Tableau de bord</span></button><button data-p="products">▦ <span>Produits</span></button><button data-p="sale">▱ <span>Vente & caisse</span></button><button data-p="stock">◫ <span>Stocks</span></button><button data-p="reports">◔ <span>Rapports</span></button><button data-p="settings">⚙ <span>Paramètres</span></button></nav><div class="user">Alain M.<small>Responsable</small></div></aside><main class="main"><header class="top"><strong id="title">Tableau de bord</strong><span class="role">Responsable</span></header><section class="content" id="content"></section></main></div><div id="modal"></div><script>
const seed={products:[['AMX-500','Amoxicilline 500 mg','Antibiotiques',3500,42,10,'Disponible'],['PAR-1000','Paracétamol 1 g','Antalgique',1200,8,12,'Stock faible'],['VIT-C','Vitamine C 500 mg','Vitamines',2800,0,8,'Rupture'],['SYP-200','Sirop antitussif','Sirop',4200,26,8,'Disponible'],['IBU-400','Ibuprofène 400 mg','Antalgique',2400,18,10,'Disponible'],['GEL-100','Gel hydroalcoolique','Hygiène',1500,64,15,'Disponible']],sales:[['V-1042','Aujourd’hui, 10:42',15400,'Espèces'],['V-1041','Aujourd’hui, 09:16',6800,'Mobile Money'],['V-1040','Hier, 17:52',9200,'Carte']]};let d=JSON.parse(localStorage.pharmaflow||'null')||seed,cart=[],cur='dashboard';const money=n=>new Intl.NumberFormat('fr-FR').format(n)+' FCFA',tag=s=>`<span class="tag ${s==='Disponible'?'':s==='Stock faible'?'warn':'danger'}">${s}</span>`;
function go(p){cur=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));document.getElementById('title').textContent={dashboard:'Tableau de bord',products:'Produits',sale:'Vente & caisse',stock:'Stocks & approvisionnement',reports:'Rapports',settings:'Paramètres'}[p];render()}function render(){document.getElementById('content').innerHTML=({dashboard,products,sale,stock,reports,settings}[cur])()}function dashboard(){return `<div class="head"><div><h1>Bonjour Alain,</h1><p>Voici l’état de votre pharmacie aujourd’hui.</p></div><button class="primary" onclick="go('sale')">＋ Nouvelle vente</button></div><div class="cards">${[['Ventes du jour',money(22200),'↗ 12,5% vs hier'],['Articles vendus','18','↗ 8,2% vs hier'],['Alertes stock','2','À traiter aujourd’hui'],['Lots à surveiller','2','Dans les 90 jours']].map(x=>`<div class="card metric"><div><span class="metric-label">${x[0]}</span><h2>${x[1]}</h2><span class="delta">${x[2]}</span></div><span class="icon">◈</span></div>`).join('')}</div><div class="grid"><div class="panel"><h3>Chiffre d’affaires — 7 derniers jours</h3><div class="bars">${[45,68,52,82,64,96,71].map((x,i)=>`<div><div class="bar ${i===6?'on':''}" style="height:${x}%"></div>${['Lun','Mar','Mer','Jeu','Ven','Sam','Auj.'][i]}</div>`).join('')}</div></div><div class="panel"><h3>Alertes à surveiller</h3><div class="alert"><i class="dot"></i><div><b>Rupture de stock</b><p>Vitamine C 500 mg — 0 unité</p></div></div><div class="alert"><i class="dot a"></i><div><b>Stock faible</b><p>Paracétamol 1 g — 8 unités</p></div></div><div class="alert"><i class="dot a"></i><div><b>Péremption proche</b><p>Sirop antitussif — 14 jours</p></div></div><button class="secondary" style="width:100%;margin-top:12px" onclick="go('stock')">Voir toutes les alertes</button></div></div><div class="panel table-panel"><h3>Dernières ventes</h3>${saleRows()}</div>`}function saleRows(){return `<table><thead><tr><th>Ticket</th><th>Date</th><th>Montant</th><th>Paiement</th></tr></thead><tbody>${d.sales.map(x=>`<tr><td><b>${x[0]}</b></td><td class="muted">${x[1]}</td><td><b>${money(x[2])}</b></td><td>${x[3]}</td></tr>`).join('')}</tbody></table>`}
function products(){return `<div class="head"><div><h1>Produits</h1><p>Catalogue, prix et seuils de stock.</p></div><button class="primary" onclick="openProduct()">＋ Ajouter un produit</button></div><div class="panel"><div class="toolbar"><input id="q" placeholder="Rechercher par nom, référence ou catégorie…" oninput="filter()"><select id="f" onchange="filter()"><option value="">Tous les statuts</option><option>Disponible</option><option>Stock faible</option><option>Rupture</option></select><button class="secondary">⇩ Exporter</button></div><div id="pt"><table><thead><tr><th>Produit</th><th>Référence</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>État</th><th></th></tr></thead><tbody>${rows(d.products)}</tbody></table></div></div>`}function rows(a){return a.map((p,i)=>`<tr><td><b>${p[1]}</b></td><td>${p[0]}</td><td>${p[2]}</td><td>${money(p[3])}</td><td>${p[4]} / min. ${p[5]}</td><td>${tag(p[6])}</td><td><button class="secondary" onclick="openProduct(${i})">Modifier</button></td></tr>`).join('')}function filter(){let q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('f').value;document.querySelector('#pt tbody').innerHTML=rows(d.products.filter(p=>(!q||p.join(' ').toLowerCase().includes(q))&&(!f||p[6]===f)))}
function sale(){return `<div class="head"><div><h1>Vente & caisse</h1><p>Recherchez un produit et encaissez rapidement.</p></div><span class="tag">Caisse ouverte</span></div><div class="sale"><div class="panel"><div class="toolbar"><input id="sq" placeholder="Rechercher un produit…" oninput="saleFilter()"><button class="secondary">⌕ Scanner</button></div><div id="tiles" class="tiles">${tiles(d.products)}</div></div><div class="panel"><h3>Panier</h3><div id="cart">${cartHtml()}</div><div class="total"><span>Total</span><span>${money(cart.reduce((a,x)=>a+x[3]*x[7],0))}</span></div><select id="paymentMode" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"><option>Espèces</option><option>Carte</option><option>Mobile Money</option></select><button class="primary" style="width:100%;margin-top:14px" onclick="checkout()">Encaisser la vente</button></div></div>`}function tiles(a){return a.map((p,i)=>`<button class="tile" onclick="add(${i})"><b>${p[1]}</b><small>${p[0]} · ${p[4]} en stock</small><strong style="color:var(--t);margin-top:10px;display:block">${money(p[3])}</strong></button>`).join('')}function saleFilter(){let q=document.getElementById('sq').value.toLowerCase();document.getElementById('tiles').innerHTML=tiles(d.products.filter(p=>p[1].toLowerCase().includes(q)||p[0].toLowerCase().includes(q)))}function add(i){let p=d.products[i];if(p[4]<1)return alert('Produit indisponible');let x=cart.find(x=>x[0]===p[0]);if(x)x[7]++;else cart.push([...p,1]);render()}function cartHtml(){return cart.length?cart.map((x,i)=>`<div class="cart"><span><b>${x[1]}</b><small class="muted" style="display:block">${money(x[3])}</small></span><span>× ${x[7]} <button class="secondary" onclick="cart.splice(${i},1);render()">Retirer</button></span></div>`).join(''):'<div class="empty">Votre panier est vide.</div>'}function checkout(){if(!cart.length)return alert('Ajoutez un produit.');let total=cart.reduce((a,x)=>a+x[3]*x[7],0);cart.forEach(x=>{let p=d.products.find(p=>p[0]===x[0]);p[4]-=x[7];p[6]=p[4]===0?'Rupture':p[4]<=p[5]?'Stock faible':'Disponible'});let payment=document.getElementById('paymentMode')?.value||'Espèces';d.sales.unshift(['V-'+(1043+d.sales.length),"Aujourd’hui, à l’instant",total,payment]);localStorage.pharmaflow=JSON.stringify(d);let ticketCart=cart.map(x=>[...x]);cart=[];openTicket(total,ticketCart,payment);render()}
function stock(){return `<div class="head"><div><h1>Stocks & approvisionnement</h1><p>Lots, réceptions, inventaires et mouvements.</p></div><button class="primary" onclick="openReception()">＋ Nouvelle réception</button></div><div class="cards">${[['Valeur du stock',money(364800),'6 produits actifs'],['Ruptures','1','Réapprovisionnement requis'],['Lots proches','2','Avant 90 jours'],['Fournisseurs actifs','4','Dernière réception : hier']].map(x=>`<div class="card"><span class="metric-label">${x[0]}</span><h2>${x[1]}</h2><span class="delta">${x[2]}</span></div>`).join('')}</div><div class="panel"><div class="tabs"><button class="active">Lots & disponibilités</button><button>Réceptions</button><button>Inventaires</button><button>Mouvements</button></div><table><thead><tr><th>Produit</th><th>Lot</th><th>Péremption</th><th>Stock</th><th>État</th></tr></thead><tbody>${d.products.map(p=>`<tr><td><b>${p[1]}</b></td><td>${p[0]}-25</td><td>12/04/2027</td><td>${p[4]}</td><td>${tag(p[6])}</td></tr>`).join('')}</tbody></table></div>`}function reports(){return `<div class="head"><div><h1>Rapports</h1><p>Analysez l’activité et exportez vos données.</p></div><button class="secondary">⇩ Exporter le rapport</button></div><div class="cards">${[['CA du mois',money(648200)],['Marge brute indicative',money(182600)],['Panier moyen',money(12700)],['Produits vendus','428']].map(x=>`<div class="card"><span class="metric-label">${x[0]}</span><h2>${x[1]}</h2><span class="delta">↗ 9,4% vs mois dernier</span></div>`).join('')}</div><div class="grid"><div class="panel"><h3>Ventes par mode de paiement</h3>${[['Espèces',62],['Mobile Money',24],['Carte',14]].map(x=>`<p><b>${x[0]}</b><span style="float:right">${x[1]}%</span></p><div style="height:8px;background:#edf2f3;border-radius:8px"><div style="height:100%;width:${x[1]}%;background:var(--t);border-radius:8px"></div></div>`).join('')}</div><div class="panel"><h3>Produits les plus vendus</h3><p><b>Paracétamol 1 g</b><br><span class="muted">86 unités</span></p><p><b>Amoxicilline 500 mg</b><br><span class="muted">64 unités</span></p><p><b>Vitamine C 500 mg</b><br><span class="muted">48 unités</span></p></div></div>`}function settings(){return `<div class="head"><div><h1>Paramètres</h1><p>Identité, règles de gestion et utilisateurs.</p></div><button class="primary" onclick="alert('Paramètres enregistrés.')">Enregistrer</button></div><div class="grid"><div class="panel"><h3>Identité de la pharmacie</h3><div class="form"><label class="full">Nom<input value="Pharmacie La Santé"></label><label>Téléphone<input value="+242 06 123 45 67"></label><label>Email<input value="contact@lasante.cg"></label><label class="full">Adresse<input value="12, avenue de la Paix, Brazzaville"></label></div></div><div class="panel"><h3>Utilisateurs & sécurité</h3><div class="alert"><b>Alain M.</b><span class="muted">Responsable · Accès complet</span></div><div class="alert"><b>Julie D.</b><span class="muted">Vendeur · Vente et consultation</span></div><button class="secondary" style="width:100%">＋ Ajouter un utilisateur</button></div></div>`}
function openReception(){document.getElementById("modal").innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><h2>Nouvelle réception</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><label class="full">Fournisseur<input id="supplier" placeholder="Nom du fournisseur"></label><label class="full">Produit<select id="recProduct">${d.products.map((p,i)=>`<option value="${i}">${p[1]} (${p[0]})</option>`).join('')}</select></label><label>Quantité reçue<input id="recQty" type="number" min="1" value="1"></label><label>Numéro de lot<input id="recLot" placeholder="Ex. LOT-2026-A"></label><label>Date de péremption<input id="recExpiry" type="date"></label></div><div class="actions"><button class="secondary" onclick="closeModal()">Annuler</button> <button class="primary" onclick="saveReception()">Valider la réception</button></div></div></div>`}function saveReception(){let i=+document.getElementById("recProduct").value,q=+document.getElementById("recQty").value,p=d.products[i];if(!document.getElementById("supplier").value||!q||q<1||!document.getElementById("recLot").value||!document.getElementById("recExpiry").value)return alert("Fournisseur, quantité, lot et péremption sont obligatoires.");p[4]+=q;p[6]=p[4]<=p[5]?"Stock faible":"Disponible";localStorage.pharmaflow=JSON.stringify(d);closeModal();alert("Réception validée : "+q+" unité(s) ajoutée(s) au stock de "+p[1]+".");render()}function openProduct(i){let p=i==null?['','','',0,0,10,'Disponible']:d.products[i];document.getElementById('modal').innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><h2>${i==null?'Ajouter un produit':'Modifier le produit'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><label class="full">Désignation<input id="n" value="${p[1]}"></label><label>Référence<input id="r" value="${p[0]}"></label><label>Catégorie<input id="c" value="${p[2]}"></label><label>Prix de vente<input id="v" type="number" value="${p[3]}"></label><label>Stock initial<input id="s" type="number" value="${p[4]}"></label><label>Seuil minimum<input id="m" type="number" value="${p[5]}"></label></div><div class="actions"><button class="secondary" onclick="closeModal()">Annuler</button> <button class="primary" onclick="saveProduct(${i==null?'null':i})">Enregistrer</button></div></div></div>`}function saveProduct(i){let p=[r.value,n.value,c.value,+v.value,+s.value,+m.value,+s.value===0?'Rupture':+s.value<=+m.value?'Stock faible':'Disponible'];if(!p[0]||!p[1])return alert('Référence et désignation obligatoires.');if(i==null)d.products.unshift(p);else d.products[i]=p;localStorage.pharmaflow=JSON.stringify(d);closeModal();render()}function closeModal(){document.getElementById('modal').innerHTML=''}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));go('dashboard');function downloadReport(){let csv='Produit;Référence;Catégorie;Prix;Stock;État\\n'+d.products.map(p=>p[1]+';'+p[0]+';'+p[2]+';'+p[3]+';'+p[4]+';'+p[6]).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rapport-pharmacie.csv';a.click()}function openTicket(total,items,payment){let ticket=document.createElement('div');ticket.className='modal-bg';ticket.innerHTML=`<div class="modal" id="ticket"><div class="modal-head"><h2>Ticket de caisse</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><p><b>Pharmacie La Santé</b><br><small>Ticket de vente · ${new Date().toLocaleString('fr-FR')}</small></p><hr>${items.map(x=>`<p style="display:flex;justify-content:space-between"><span>${x[1]} × ${x[7]}</span><b>${money(x[3]*x[7])}</b></p>`).join('')}<hr><p style="display:flex;justify-content:space-between;font-size:18px"><b>Total</b><b>${money(total)}</b></p><p class="muted">Paiement : ${payment}</p><div class="actions"><button class="secondary" onclick="this.closest('.modal-bg').remove()">Fermer</button> <button class="primary" onclick="printTicket()">Imprimer le ticket</button></div></div>`;document.body.appendChild(ticket)}function printTicket(){let el=document.getElementById('ticket');let w=window.open('','_blank','width=420,height=650');w.document.write('<html><head><title>Ticket de caisse</title><style>body{font:14px Arial;padding:20px}hr{border:0;border-top:1px solid #ccc}p{margin:12px 0}</style></head><body>'+el.innerHTML.replace(/<div class="actions">[\s\S]*?<\/div>/,'')+'</body></html>');w.document.close();w.focus();w.print()}function stockModule(label){let panel=document.querySelector('.tabs')?.parentElement;if(!panel)return;let old=panel.querySelector('#stockModule');if(old)old.remove();let box=document.createElement('div');box.id='stockModule';box.className='table-panel';if(label==='Réceptions'){box.innerHTML='<h3>Réceptions enregistrées</h3><div class="empty">Aucune réception enregistrée pour le moment.<br><button class="primary" onclick="openReception()">＋ Nouvelle réception</button></div>'}else if(label==='Inventaires'){box.innerHTML='<h3>Inventaire</h3><p class="muted">Saisissez les quantités réellement comptées.</p><table><thead><tr><th>Produit</th><th>Stock théorique</th><th>Stock compté</th><th>Écart</th><th>Action</th></tr></thead><tbody>'+d.products.map((p,i)=>`<tr><td>${p[1]}</td><td>${p[4]}</td><td><input id="count${i}" type="number" value="${p[4]}" style="width:90px;padding:7px;border:1px solid var(--line);border-radius:6px"></td><td id="diff${i}">0</td><td><button class="secondary" onclick="adjustInventory(${i})">Valider</button></td></tr>`).join('')+'</tbody></table>'}else if(label==='Mouvements'){box.innerHTML='<h3>Historique des mouvements</h3><table><thead><tr><th>Date</th><th>Produit</th><th>Type</th><th>Quantité</th><th>Motif</th></tr></thead><tbody><tr><td>Aujourd’hui</td><td>Paracétamol 1 g</td><td>Vente</td><td>-3</td><td>Ticket V-1042</td></tr><tr><td>Hier</td><td>Amoxicilline 500 mg</td><td>Réception</td><td>+20</td><td>BL-2026-041</td></tr></tbody></table>'}panel.appendChild(box)}function adjustInventory(i){let p=d.products[i],n=+document.getElementById('count'+i).value;if(n<0)return alert('Quantité invalide');let diff=n-p[4];p[4]=n;p[6]=n===0?'Rupture':n<=p[5]?'Stock faible':'Disponible';localStorage.pharmaflow=JSON.stringify(d);document.getElementById('diff'+i).textContent=(diff>0?'+':'')+diff;alert('Inventaire validé pour '+p[1])}document.addEventListener('click',e=>{if(e.target.matches('.head .secondary')&&cur==='reports')downloadReport();if(e.target.closest('.tabs button'))stockModule(e.target.closest('.tabs button').textContent)});</script></body></html>
